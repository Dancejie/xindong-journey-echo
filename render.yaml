services:
  - type: web
    name: xindong-journey-echo
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.init_db && uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_AUTH_MODE
        value: public
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: AGENT_RATE_LIMIT
        value: "20"
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: xindong-journey-db
          property: connectionString

databases:
  - name: xindong-journey-db
    plan: free
    region: singapore
    databaseName: xindong_journey
    user: xindong_journey
    ipAllowList: []
